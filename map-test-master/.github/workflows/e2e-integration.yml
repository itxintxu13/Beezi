name: CI - Integration & E2E

on:
  push:
    branches: [ feat/migrate-to-maplibre, main ]
  pull_request:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install npm deps
        run: npm ci

      - name: Run integration test (server side)
        run: npm run test:integration

  e2e:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Start mock backend (background)
        run: npm run start:mock:fixed &

      - name: Run E2E UI test
        env:
          FRONTEND_PORT: 4310
          CI: true
        run: npm run ci:e2e

      - name: Collect logs (on failure)
        if: failure()
        run: |
          echo "--- Mock backend logs ---"
          ps aux | grep mock-backend || true
          echo "--- Node processes ---"
          ps aux | grep node || true
